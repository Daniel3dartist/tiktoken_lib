[package]
name = "tiktoken"
version = "0.1.0"
edition = "2021"
description = "Fast BPE tokenizer (OpenAI tiktoken core) with C/C++ FFI"
license = "MIT"
readme = "README.md"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
base64 = "0.22"
bstr = "1.12.1"
fancy-regex = "0.17.0"
rustc-hash = "2.1.1"
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
ureq = { version = "2.10", default-features = true }

[dev-dependencies]
tempfile = "3.14"
